[package]
name = "lunaz-core"
version = "0.1.0"
edition = "2021"

[dependencies]
zcash_keys = { version = "0.16.1", features = ["orchard"] }
zcash_address = "0.13.0"
zcash_protocol = "0.10.6"
zcash_primitives = "0.30.1"
zcash_client_backend = { version = "0.24.0", features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zip321 = "0.9.0"
orchard = "0.15"
zcash_note_encryption = "0.4.1"
zip32 = "0.2"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
argon2 = "0.5"

[dev-dependencies]
zcash_keys = { version = "0.16.1", features = ["orchard", "test-dependencies"] }
